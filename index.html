<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#e8d5ad"
  >

  <meta
    name="description"
    content="A refined offline Gomoku game."
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icons/icon-192.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="./icons/icon-512.png"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./icons/icon-192.png"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <title>Gomoku</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

<div class="app-shell">

  <!-- =====================================================
       TOP BAR
       ===================================================== -->

  <header class="topbar">

    <button
      class="icon-button"
      id="backButton"
      type="button"
      aria-label="Back"
    >
      <span aria-hidden="true">‹</span>
    </button>


    <div class="brand">

      <span
        class="brand-mark"
        aria-hidden="true"
      ></span>

      <span class="brand-name">
        Gomoku
      </span>

    </div>


    <button
      class="icon-button"
      id="menuButton"
      type="button"
      aria-label="Menu"
    >
      <span aria-hidden="true">•••</span>
    </button>

  </header>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main>

    <!-- ===================================================
         HOME
         =================================================== -->

    <section
      class="screen active"
      id="homeScreen"
    >

      <div class="home-content">

        <div
          class="hero-mark"
          aria-hidden="true"
        >

          <div
            class="hero-stone hero-black"
          ></div>

          <div
            class="hero-stone hero-white"
          ></div>

        </div>


        <h1>
          五子棋
        </h1>


        <p class="subtitle">
          簡單的規則，沒有簡單的棋局。
        </p>


        <div class="home-actions">

          <button
            class="primary-button"
            id="startButton"
            type="button"
          >
            開始遊戲
          </button>


          <button
            class="secondary-button"
            id="recordsButton"
            type="button"
          >
            棋局記錄
          </button>


          <button
            class="secondary-button"
            id="settingsButton"
            type="button"
          >
            設定
          </button>

        </div>


        <div
          class="home-status"
          id="resumeCard"
          hidden
        >

          <div>

            <span class="status-label">
              未完成棋局
            </span>

            <strong
              id="resumeText"
            ></strong>

          </div>


          <button
            class="text-button"
            id="resumeButton"
            type="button"
          >
            繼續
          </button>

        </div>

      </div>

    </section>


    <!-- ===================================================
         SETUP
         =================================================== -->

    <section
      class="screen"
      id="setupScreen"
    >

      <div class="screen-content">

        <h2>
          開始遊戲
        </h2>


        <!-- MODE -->

        <div class="settings-group">

          <h3>
            對戰方式
          </h3>


          <div
            class="segmented-control"
            id="modeControl"
          >

            <button
              type="button"
              class="segment selected"
              data-mode="ai"
            >
              人機
            </button>


            <button
              type="button"
              class="segment"
              data-mode="local"
            >
              雙人
            </button>

          </div>

        </div>


        <!-- DIFFICULTY -->

        <div
          class="settings-group"
          id="difficultyGroup"
        >

          <h3>
            難度
          </h3>


          <div class="difficulty-grid">

            <button
              class="difficulty-card selected"
              type="button"
              data-difficulty="easy"
            >

              <strong>
                初級
              </strong>

              <span>
                適合第一次玩
              </span>

            </button>


            <button
              class="difficulty-card"
              type="button"
              data-difficulty="normal"
            >

              <strong>
                中級
              </strong>

              <span>
                開始認真下棋
              </span>

            </button>


            <button
              class="difficulty-card"
              type="button"
              data-difficulty="hard"
            >

              <strong>
                高級
              </strong>

              <span>
                需要真正思考
              </span>

            </button>

          </div>

        </div>


        <!-- AI CHARACTER -->

        <div
          class="settings-group"
          id="characterGroup"
        >

          <h3>
            AI 對手
          </h3>


          <div
            class="difficulty-grid"
            id="characterControl"
          >

            <button
              class="difficulty-card selected"
              type="button"
              data-character="mio"
            >

              <strong>
                Mio
              </strong>

              <span>
                溫和、防守型
              </span>

            </button>


            <button
              class="difficulty-card"
              type="button"
              data-character="rin"
            >

              <strong>
                Rin
              </strong>

              <span>
                積極、進攻型
              </span>

            </button>


            <button
              class="difficulty-card"
              type="button"
              data-character="sora"
            >

              <strong>
                Sora
              </strong>

              <span>
                冷靜、平衡型
              </span>

            </button>


            <button
              class="difficulty-card"
              type="button"
              data-character="kuro"
            >

              <strong>
                Kuro
              </strong>

              <span>
                狡猾、反擊型
              </span>

            </button>

          </div>

        </div>


        <!-- SIDE -->

        <div class="settings-group">

          <h3>
            你的棋子
          </h3>


          <div class="side-picker">

            <button
              class="side-card selected"
              type="button"
              data-side="black"
            >

              <span
                class="preview-stone black-stone"
              ></span>

              <strong>
                黑棋
              </strong>

              <span>
                先手
              </span>

            </button>


            <button
              class="side-card"
              type="button"
              data-side="white"
            >

              <span
                class="preview-stone white-stone"
              ></span>

              <strong>
                白棋
              </strong>

              <span>
                後手
              </span>

            </button>

          </div>

        </div>


        <button
          class="primary-button full-button"
          id="beginGameButton"
          type="button"
        >
          開始
        </button>

      </div>

    </section>


    <!-- ===================================================
         GAME
         =================================================== -->

    <section
      class="screen game-screen"
      id="gameScreen"
    >

      <div class="game-layout">

        <!-- GAME STATUS -->

        <div class="game-status">

          <div class="player-indicator">

            <span
              class="status-stone black-stone"
              id="turnStone"
            ></span>


            <div>

              <span
                class="status-label"
                id="turnLabel"
              >
                你的回合
              </span>


              <strong
                id="turnPlayer"
              >
                黑棋
              </strong>

            </div>

          </div>


          <div
            class="thinking-indicator"
            id="thinkingIndicator"
            hidden
          >

            <span
              class="thinking-dot"
            ></span>

            <span>
              思考中
            </span>

          </div>

        </div>


        <!-- AI OS -->

        <div
          class="ai-os"
          id="aiOS"
          hidden
        >

          <div class="ai-os-avatar">

            <span id="aiOSAvatar">
              M
            </span>

          </div>


          <div class="ai-os-content">

            <div class="ai-os-header">

              <strong id="aiOSName">
                Mio
              </strong>

              <span>
                OS
              </span>

            </div>


            <p id="aiOSText">
              嗯……先看看這裡。
            </p>

          </div>

        </div>


        <!-- BOARD -->

        <div class="board-wrapper">

          <canvas
            id="boardCanvas"
            aria-label="Gomoku board"
            role="application"
            tabindex="0"
          ></canvas>

        </div>


        <!-- GAME ACTIONS -->

        <div class="game-actions">

          <button
            class="game-action"
            id="undoButton"
            type="button"
          >

            <span aria-hidden="true">
              ↶
            </span>

            <span>
              悔棋
            </span>

          </button>


          <button
            class="game-action"
            id="restartButton"
            type="button"
          >

            <span aria-hidden="true">
              ↻
            </span>

            <span>
              重新開始
            </span>

          </button>


          <button
            class="game-action"
            id="gameMenuButton"
            type="button"
          >

            <span aria-hidden="true">
              •••
            </span>

            <span>
              選單
            </span>

          </button>

        </div>

      </div>

    </section>


    <!-- ===================================================
         RESULT
         =================================================== -->

    <section
      class="screen"
      id="resultScreen"
    >

      <div class="result-content">

        <div
          class="result-mark"
          id="resultMark"
          aria-hidden="true"
        >

          <span></span>

        </div>


        <p
          class="result-kicker"
          id="resultKicker"
        ></p>


        <h2
          id="resultTitle"
        ></h2>


        <p
          id="resultDescription"
        ></p>


        <div class="result-actions">

          <button
            class="primary-button"
            id="playAgainButton"
            type="button"
          >
            再來一局
          </button>


          <button
            class="secondary-button"
            id="resultHomeButton"
            type="button"
          >
            返回首頁
          </button>

        </div>

      </div>

    </section>


    <!-- ===================================================
         RECORDS
         =================================================== -->

    <section
      class="screen"
      id="recordsScreen"
    >

      <div class="screen-content">

        <h2>
          棋局記錄
        </h2>


        <div class="stats-grid">

          <div class="stat-card">

            <span>
              對局
            </span>

            <strong
              id="statGames"
            >
              0
            </strong>

          </div>


          <div class="stat-card">

            <span>
              勝利
            </span>

            <strong
              id="statWins"
            >
              0
            </strong>

          </div>


          <div class="stat-card">

            <span>
              失敗
            </span>

            <strong
              id="statLosses"
            >
              0
            </strong>

          </div>


          <div class="stat-card">

            <span>
              平局
            </span>

            <strong
              id="statDraws"
            >
              0
            </strong>

          </div>

        </div>


        <div
          class="record-list"
          id="recordList"
        ></div>


        <button
          class="secondary-button full-button"
          id="clearRecordsButton"
          type="button"
        >
          清除記錄
        </button>

      </div>

    </section>


    <!-- ===================================================
         SETTINGS
         =================================================== -->

    <section
      class="screen"
      id="settingsScreen"
    >

      <div class="screen-content">

        <h2>
          設定
        </h2>


        <div class="settings-list">

          <!-- LANGUAGE -->

          <label class="setting-row">

            <span>

              <strong>
                語言
              </strong>

              <small>
                選擇介面語言
              </small>

            </span>


            <select
              id="languageSelect"
            >

              <option value="zh-TW">
                繁體中文
              </option>

              <option value="zh-CN">
                简体中文
              </option>

              <option value="en">
                English
              </option>

              <option value="ja">
                日本語
              </option>

              <option value="ko">
                한국어
              </option>

            </select>

          </label>


          <!-- SOUND EFFECT -->

          <label class="setting-row">

            <span>

              <strong>
                音效
              </strong>

              <small>
                落子與遊戲音效
              </small>

            </span>


            <input
              id="soundToggle"
              type="checkbox"
              checked
            >

          </label>


          <!-- BACKGROUND MUSIC -->

          <label class="setting-row">

            <span>

              <strong>
                背景音樂
              </strong>

              <small>
                Wabi-Sabi 背景音樂
              </small>

            </span>


            <input
              id="musicToggle"
              type="checkbox"
              checked
            >

          </label>


          <!-- MOTION -->

          <label class="setting-row">

            <span>

              <strong>
                動畫
              </strong>

              <small>
                啟用遊戲動畫
              </small>

            </span>


            <input
              id="motionToggle"
              type="checkbox"
              checked
            >

          </label>


          <!-- THEME -->

          <label class="setting-row">

            <span>

              <strong>
                外觀
              </strong>

              <small>
                使用系統外觀
              </small>

            </span>


            <select
              id="themeSelect"
            >

              <option value="system">
                System
              </option>

              <option value="light">
                Light
              </option>

              <option value="dark">
                Dark
              </option>

            </select>

          </label>

        </div>

      </div>

    </section>

  </main>


  <!-- =====================================================
       TOAST
       ===================================================== -->

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>

</div>


<!-- =======================================================
     SCRIPTS
     =======================================================

     i18n.js
       ↓
     audio.js
       ↓
     app.js

     audio.js is a module and handles:
     - UI SFX
     - native audio fallback
     - Wabi-Sabi BGM
     - iOS audio unlock
     - music toggle
     - music resume
     - button interaction
     ======================================================= -->

<script
  src="./js/i18n.js"
></script>


<script
  type="module"
  src="./js/audio.js"
></script>


<script
  type="module"
  src="./app.js"
></script>

</body>
</html>
